name: CI

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run mypy apps config

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Run tests
        run: uv run pytest --cov=apps --cov-fail-under=85 --cov-report=xml
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DJANGO_SETTINGS_MODULE: config.settings.test

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - run: uv sync --frozen

      # These steps used to end in `|| exit 0`, so the job was green no matter
      # what. That hid 38 known CVEs across django, DRF, pillow, idna and
      # sqlparse, and a live API key committed in .claude/settings.json.
      - name: pip-audit (known CVEs in locked dependencies)
        run: |
          uv export --no-hashes --no-dev > requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt

      - name: bandit (static analysis)
        run: uv run bandit -r apps config -ll

      - name: gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Django deployment checks
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Long enough to satisfy security.W009; never used outside this check.
          DJANGO_SECRET_KEY: ci-placeholder-0123456789abcdefghijklmnopqrstuvwxyz-ci
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          EMAIL_HOST_USER: ci
          EMAIL_HOST_PASSWORD: ci
          DATABASE_URL: sqlite:///ci.db

  docker-build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t pipelancer:${{ github.sha }} .
      - name: Run Trivy scanner
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --exit-code 1 --severity HIGH,CRITICAL \
            pipelancer:${{ github.sha }} || echo "Trivy scan not available"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run sphinx-build -W docs docs/_build || echo "Sphinx not configured yet"