version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # The Dockerfile lives in deploy/, not the repo root -- pointed at "/" this
  # ecosystem never detected a base image to update.
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"

  # This ecosystem requires the repository root, not the workflows directory.
  # Pointed at "/.github/workflows" it silently produced no updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
