[project]
name = "freelancer-tracker"
version = "0.1.0"
description = "Django web app for freelancers to track proposals, clients, follow-ups, hours"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "djangorestframework>=3.15.0",
    "django-allauth>=0.64.0",
    "django-environ>=0.12.0",
    "dj-database-url>=2.2.0",
    "whitenoise>=6.8.0",
    "gunicorn>=23.0.0",
    "Pillow>=11.0.0",
    "pydantic>=2.0.0",
    "django-debug-toolbar>=5.0.0",
    "tailwind>=0.1.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "djlint>=1.36.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "sphinx>=8.1.0",
    "sphinx-rtd-theme>=3.0.0",
    "django-debug-toolbar>=5.0.0",
]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=85"

