{% extends "base.html" %}

{% block title %}Delete Time Entry - Freelancer Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Delete Time Entry</h1>
        <p class="page-subtitle">This action cannot be undone.</p>
    </div>
</div>

<div class="card mb-lg">
    <div class="p-lg">
        <p class="text-secondary">Are you sure you want to delete this time entry?</p>
    </div>
</div>

<div class="flex gap-md">
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary" style="background: var(--color-error); border-color: var(--color-error);">Delete</button>
    </form>
    <a href="{% url 'timeentry-list' %}" class="btn btn-ghost">Cancel</a>
</div>
{% endblock %}
