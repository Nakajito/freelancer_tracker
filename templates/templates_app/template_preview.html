{% extends "base.html" %}

{% block title %}Preview - {{ template.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Preview: {{ template.name }}</h1>
        <p class="page-subtitle">Test your template with sample data.</p>
    </div>
    <a href="{% url 'template-list' %}" class="btn btn-ghost">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<form method="get" class="filter-bar">
    <div class="form-group" style="flex: 1;">
        <label class="form-label" for="client">Client Name</label>
        <input type="text" name="client" class="form-control" placeholder="Client Name" value="{{ request.GET.client }}">
    </div>
    <div class="form-group" style="flex: 1;">
        <label class="form-label" for="project">Project Title</label>
        <input type="text" name="project" class="form-control" placeholder="Project Title" value="{{ request.GET.project }}">
    </div>
    <div class="form-group" style="flex: 1;">
        <label class="form-label" for="amount">Amount</label>
        <input type="text" name="amount" class="form-control" placeholder="Amount" value="{{ request.GET.amount }}">
    </div>
    <div class="flex items-end">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-arrow-repeat"></i> Update
        </button>
    </div>
</form>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Rendered Template</h3>
    </div>
    <div class="p-lg" style="background: var(--color-surface-muted);">
        {{ rendered|linebreaks }}
    </div>
</div>
{% endblock %}
