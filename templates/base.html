{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ active_language|default:'en' }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                {% if page_title %}{{ page_title }} -{% endif %}
                PropoTrack
            {% endblock %}
        </title>
        <meta name="description" content="{% block meta_description %}{% trans "PropoTrack — track freelance proposals, follow-ups, time entries, and revenue in one place." %}{% endblock %}">
        <link rel="preload" href="{% static 'fonts/libre-baskerville/libre-baskerville-latin-400.woff2' %}" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="{% static 'fonts/roboto/roboto-v51-latin-regular.woff2' %}" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="{% static 'css/app.css' %}">
        <link rel="stylesheet" href="{% static 'css/icons.css' %}">
        <link rel="stylesheet" href="{% static 'css/forms.css' %}">
        <link rel="stylesheet" href="{% static 'css/htmx.css' %}">
        <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
        {% block extra_css %}{% endblock %}
    </head>
    <body class="bg-background text-on-background font-body-md antialiased">
        {% block body %}
            {% include "partials/_messages.html" %}
            <main>
                {% block content %}{% endblock %}
            </main>
        {% endblock %}
        <script src="{% static 'vendor/htmx-1.9.10.min.js' %}" defer></script>
        <script src="{% static 'js/preferences.js' %}" defer></script>
        <script src="{% static 'js/notifications.js' %}" defer></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
