{% extends "base.html" %}

{% block title %}Delete Follow-up - Freelancer Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Delete Follow-up</h1>
        <p class="page-subtitle">This action cannot be undone.</p>
    </div>
</div>

<div class="card mb-lg">
    <div class="p-lg">
        <p class="text-secondary">Are you sure you want to delete this follow-up for "<span class="fw-semibold">{{ object.proposal.title }}</span>"?</p>
    </div>
</div>

<div class="flex gap-md">
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary" style="background: var(--color-error); border-color: var(--color-error);">
            <i class="bi bi-trash"></i> Delete
        </button>
    </form>
    <a href="{% url 'followup-list' %}" class="btn btn-ghost">
        Cancel
    </a>
</div>
{% endblock %}
